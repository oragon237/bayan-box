# HABI — production nginx vhost (Ubuntu 24.04, PHP 8.3-FPM)
# Install: sudo cp deploy/nginx.becoolbox.app.conf /etc/nginx/sites-available/habi
#          sudo ln -s /etc/nginx/sites-available/habi /etc/nginx/sites-enabled/habi
# Paths assume the layout from deploy/README.md:
#   frontend (vite dist)  → /var/www/habi/frontend
#   backend  (Laravel)    → /var/www/habi/backend   (served via public/index.php)

# --- HTTP: ACME challenges + hard redirect to HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name becoolbox.app www.becoolbox.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/habi/certbot;
    }

    location / {
        return 301 https://becoolbox.app$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name becoolbox.app www.becoolbox.app;

    ssl_certificate     /etc/letsencrypt/live/becoolbox.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/becoolbox.app/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;          # POD photos / product images
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---------- PWA (static Vite build, same-origin /api) ----------
    root /var/www/habi/frontend;
    index index.html;

    # Hashed assets are immutable; service worker + manifest must revalidate
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js                  { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest   { add_header Cache-Control "no-cache"; }

    # ---------- Laravel API ----------
    location ^~ /api {
        try_files $uri /index.php$is_args$args;
    }
    location ^~ /sanctum {
        try_files $uri /index.php$is_args$args;
    }
    location = /up {                   # framework health probe
        try_files /index.php$is_args$args;
    }

    # User uploads (delivery proof photos, ads) — storage:link target
    location ^~ /storage/ {
        alias /var/www/habi/backend/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # All API routes are front-controlled through the backend index
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/habi/backend/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/habi/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        internal;
    }

    # ---------- SPA fallback (React Router history mode) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
